server:
  port: 8081

spring:
  application:
    name: validator-service
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: guest
    password: guest

validator:
  failure-rate: 0.5
  retry:
    max-attempts: 5
    initial-interval-ms: 500
    multiplier: 2.0
    max-interval-ms: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
